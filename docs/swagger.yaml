basePath: /
definitions:
  user.AdminUserListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/user.UserDTO'
        type: array
      message:
        type: string
      pagination:
        $ref: '#/definitions/user.PaginationResponse'
      success:
        type: boolean
    type: object
  user.AdminUserResponse:
    properties:
      data:
        $ref: '#/definitions/user.UserDTO'
      message:
        type: string
      success:
        type: boolean
    type: object
  user.AuthResponse:
    properties:
      locked_until:
        type: string
      message:
        type: string
      refresh_token:
        type: string
      retry_after_seconds:
        type: integer
      success:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/user.UserDTO'
    type: object
  user.ListPermissionsResponse:
    properties:
      data:
        $ref: '#/definitions/user.UserPermissionsDTO'
      message:
        type: string
      success:
        type: boolean
    type: object
  user.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  user.ManagePermissionRequest:
    properties:
      permission:
        type: string
      user_id:
        type: integer
    required:
    - permission
    - user_id
    type: object
  user.ManagePermissionResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  user.PaginationResponse:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  user.PermissionRoleDTO:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  user.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  user.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - username
    type: object
  user.UpdateEmailRequest:
    properties:
      new_email:
        type: string
    required:
    - new_email
    type: object
  user.UpdatePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  user.UpdateProfileRequest:
    properties:
      full_name:
        type: string
    required:
    - full_name
    type: object
  user.UpdateUsernameRequest:
    properties:
      new_username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - new_username
    type: object
  user.UserDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      updated_at:
        type: string
      username:
        type: string
    type: object
  user.UserPermissionsDTO:
    properties:
      direct_permissions:
        items:
          type: string
        type: array
      effective_permissions:
        items:
          type: string
        type: array
      roles:
        items:
          $ref: '#/definitions/user.PermissionRoleDTO'
        type: array
      user_id:
        type: integer
    type: object
  user.UserResponse:
    properties:
      data:
        $ref: '#/definitions/user.UserDTO'
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Type "Bearer" followed by a space and JWT token.
  title: Monthly Expense API
  version: "1.0"
paths:
  /api/v1/admin/users:
    get:
      consumes:
      - application/json
      description: Return a paginated list of all users. Only super users may do this.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size 1..100 (default 10)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.AdminUserListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.AdminUserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.AdminUserListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.AdminUserListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.AdminUserListResponse'
      security:
      - BearerAuth: []
      summary: List users (admin)
      tags:
      - admin
  /api/v1/admin/users/{id}:
    get:
      consumes:
      - application/json
      description: Return one user by id. Only super users may do this.
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
      security:
      - BearerAuth: []
      summary: Look up a user (admin)
      tags:
      - admin
  /api/v1/admin/users/{id}/deactivate:
    post:
      consumes:
      - application/json
      description: Revoke a user's ability to log in. Only super users may do this.
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
      security:
      - BearerAuth: []
      summary: Deactivate a user (admin)
      tags:
      - admin
  /api/v1/admin/users/{id}/reactivate:
    post:
      consumes:
      - application/json
      description: Restore a deactivated user's ability to log in. Only super users
        may do this.
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.AdminUserResponse'
      security:
      - BearerAuth: []
      summary: Reactivate a user (admin)
      tags:
      - admin
  /api/v1/users/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: User credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.AuthResponse'
      summary: Login user
      tags:
      - users
  /api/v1/users/logout:
    post:
      consumes:
      - application/json
      description: |-
        Revoke the refresh token server-side and clear authentication
        cookies. The refresh token is read from the request body or the
        refresh cookie.
      parameters:
      - description: Refresh token (optional if refresh cookie is sent)
        in: body
        name: credentials
        schema:
          $ref: '#/definitions/user.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
      summary: Logout user
      tags:
      - users
  /api/v1/users/permissions:
    get:
      consumes:
      - application/json
      description: |-
        List a user's effective permissions: direct grants plus
        role-derived permissions, with roles broken out separately.
        Lists the authenticated user by default; an optional user_id
        query parameter lists another user and requires super user.
      parameters:
      - description: Target user id (defaults to the authenticated user)
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ListPermissionsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ListPermissionsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ListPermissionsResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.ListPermissionsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ListPermissionsResponse'
      security:
      - BearerAuth: []
      summary: List permissions
      tags:
      - users
  /api/v1/users/permissions/grant:
    post:
      consumes:
      - application/json
      description: Grant a permission string to a target user. Only super user may
        do this.
      parameters:
      - description: Permission grant data
        in: body
        name: permission
        required: true
        schema:
          $ref: '#/definitions/user.ManagePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ManagePermissionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ManagePermissionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ManagePermissionResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.ManagePermissionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ManagePermissionResponse'
      security:
      - BearerAuth: []
      summary: Grant permission
      tags:
      - users
  /api/v1/users/permissions/revoke:
    post:
      consumes:
      - application/json
      description: Revoke a permission from a target user. Only superuser may do this.
      parameters:
      - description: Permission revoke data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.ManagePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ManagePermissionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ManagePermissionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ManagePermissionResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.ManagePermissionResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ManagePermissionResponse'
      security:
      - BearerAuth: []
      summary: Revoke permission
      tags:
      - users
  /api/v1/users/profile:
    get:
      consumes:
      - application/json
      description: Get the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.UserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.UserResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update the authenticated user's profile fields (full_name)
      parameters:
      - description: Profile update data
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/user.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.UserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.UserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.UserResponse'
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - users
  /api/v1/users/profile/email:
    put:
      consumes:
      - application/json
      description: |-
        Change the authenticated user's email address. Returns 409 if
        the address is already in use.
      parameters:
      - description: New email
        in: body
        name: email
        required: true
        schema:
          $ref: '#/definitions/user.UpdateEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.UserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.UserResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/user.UserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.UserResponse'
      security:
      - BearerAuth: []
      summary: Update email
      tags:
      - users
  /api/v1/users/profile/password:
    put:
      consumes:
      - application/json
      description: Update the authenticated user's password
      parameters:
      - description: Password update data
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/user.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.UserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.UserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.UserResponse'
      security:
      - BearerAuth: []
      summary: Update password
      tags:
      - users
  /api/v1/users/profile/username:
    put:
      consumes:
      - application/json
      description: Update the authenticated user's username
      parameters:
      - description: New username
        in: body
        name: username
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUsernameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.UserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.UserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.UserResponse'
      security:
      - BearerAuth: []
      summary: Update username
      tags:
      - users
  /api/v1/users/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchange a refresh token for a fresh access + refresh pair.
        The presented refresh token is revoked server-side (rotation),
        so each refresh token can be used exactly once.
      parameters:
      - description: Refresh token (optional if refresh cookie is sent)
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/user.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.AuthResponse'
      summary: Rotate refresh token
      tags:
      - users
  /api/v1/users/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.AuthResponse'
      summary: Register a new user
      tags:
      - users
  /api/v1/users/register-workflow:
    post:
      consumes:
      - application/json
      description: |-
        Validate the input and enqueue a register_user workflow job.
        The user is created and granted its permission by background
        workers instead of synchronously in the request.
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.AuthResponse'
      summary: Register a user asynchronously via the workflow engine
      tags:
      - users
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
