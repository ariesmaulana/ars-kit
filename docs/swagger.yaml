basePath: /
definitions:
  user.AuthResponse:
    properties:
      locked_until:
        type: string
      message:
        type: string
      refresh_token:
        type: string
      retry_after_seconds:
        type: integer
      success:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/user.UserDTO'
    type: object
  user.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  user.ManageRolePermissionRequest:
    properties:
      permission:
        type: string
      role:
        type: string
    required:
    - permission
    - role
    type: object
  user.ManageRoleRequest:
    properties:
      role:
        type: string
      user_id:
        type: integer
    required:
    - role
    - user_id
    type: object
  user.ManageRoleResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  user.PaginationResponse:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  user.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  user.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - full_name
    - password
    - username
    type: object
  user.UpdatePasswordRequest:
    properties:
      new_password:
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  user.UpdateUserStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  user.UpdateUsernameRequest:
    properties:
      new_username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - new_username
    type: object
  user.UserDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  user.UserListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/user.UserDTO'
        type: array
      message:
        type: string
      pagination:
        $ref: '#/definitions/user.PaginationResponse'
      success:
        type: boolean
    type: object
  user.UserResponse:
    properties:
      data:
        $ref: '#/definitions/user.UserDTO'
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Type "Bearer" followed by a space and JWT token.
  title: Monthly Expense API
  version: "1.0"
paths:
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: |-
        List users with pagination and an optional username/email
        filter. Requires the super_user permission.
      parameters:
      - description: Page (1-based, default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 10)
        in: query
        name: size
        type: integer
      - description: Filter by username or email substring
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.UserListResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.UserListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.UserListResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      consumes:
      - application/json
      description: |-
        Hard-delete a user (GDPR erasure). Requires the super_user
        permission.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.UserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.UserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.UserResponse'
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - users
    get:
      consumes:
      - application/json
      description: Fetch any user by id. Requires the super_user permission.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.UserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.UserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.UserResponse'
      security:
      - BearerAuth: []
      summary: Get a user by id
      tags:
      - users
  /api/v1/users/{id}/status:
    put:
      consumes:
      - application/json
      description: |-
        Set a user's status to active, disabled, or suspended. Requires
        the super_user permission. Disabling or suspending also revokes
        all the target's active refresh tokens.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.UserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.UserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.UserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.UserResponse'
      security:
      - BearerAuth: []
      summary: Update a user's status
      tags:
      - users
  /api/v1/users/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: User credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.AuthResponse'
      summary: Login user
      tags:
      - users
  /api/v1/users/logout:
    post:
      consumes:
      - application/json
      description: |-
        Revoke the refresh token server-side and clear authentication
        cookies. The refresh token is read from the request body or the
        refresh cookie.
      parameters:
      - description: Refresh token (optional if refresh cookie is sent)
        in: body
        name: credentials
        schema:
          $ref: '#/definitions/user.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
      summary: Logout user
      tags:
      - users
  /api/v1/users/profile:
    get:
      consumes:
      - application/json
      description: Get the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.UserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.UserResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - users
  /api/v1/users/profile/password:
    put:
      consumes:
      - application/json
      description: Update the authenticated user's password
      parameters:
      - description: Password update data
        in: body
        name: password
        required: true
        schema:
          $ref: '#/definitions/user.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.UserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.UserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.UserResponse'
      security:
      - BearerAuth: []
      summary: Update password
      tags:
      - users
  /api/v1/users/profile/username:
    put:
      consumes:
      - application/json
      description: Update the authenticated user's username
      parameters:
      - description: New username
        in: body
        name: username
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUsernameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.UserResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.UserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.UserResponse'
      security:
      - BearerAuth: []
      summary: Update username
      tags:
      - users
  /api/v1/users/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Exchange a refresh token for a fresh access + refresh pair.
        The presented refresh token is revoked server-side (rotation),
        so each refresh token can be used exactly once.
      parameters:
      - description: Refresh token (optional if refresh cookie is sent)
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/user.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.AuthResponse'
      summary: Rotate refresh token
      tags:
      - users
  /api/v1/users/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.AuthResponse'
      summary: Register a new user
      tags:
      - users
  /api/v1/users/register-workflow:
    post:
      consumes:
      - application/json
      description: |-
        Validate the input and enqueue a register_user workflow job.
        The user is created and granted its permission by background
        workers instead of synchronously in the request.
      parameters:
      - description: User registration data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.AuthResponse'
      summary: Register a user asynchronously via the workflow engine
      tags:
      - users
  /api/v1/users/roles/assign:
    post:
      consumes:
      - application/json
      description: |-
        Assign a role to a target user. Only super user may do this.
        Bootstrap-only roles (super_user) are refused.
      parameters:
      - description: Role assignment data
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/user.ManageRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
      security:
      - BearerAuth: []
      summary: Assign role
      tags:
      - users
  /api/v1/users/roles/permissions/grant:
    post:
      consumes:
      - application/json
      description: |-
        Add a catalog-registered permission to a role. Only super user
        may do this; the super_user role cannot be modified.
      parameters:
      - description: Role permission grant data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.ManageRolePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
      security:
      - BearerAuth: []
      summary: Grant a permission to a role
      tags:
      - users
  /api/v1/users/roles/permissions/revoke:
    post:
      consumes:
      - application/json
      description: |-
        Remove a permission from a role. Only super user may do this;
        the super_user role cannot be modified.
      parameters:
      - description: Role permission revoke data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.ManageRolePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
      security:
      - BearerAuth: []
      summary: Revoke a permission from a role
      tags:
      - users
  /api/v1/users/roles/unassign:
    post:
      consumes:
      - application/json
      description: Remove a role from a target user. Only super user may do this.
      parameters:
      - description: Role removal data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.ManageRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ManageRoleResponse'
      security:
      - BearerAuth: []
      summary: Unassign role
      tags:
      - users
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
